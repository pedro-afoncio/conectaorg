<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar doações | ConectaONG</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body data-perfil="admin">
  <header class="cabecalho">
    <div class="container">
      <a href="admin-painel.html" class="logo"><img src="img/logo.png"
          alt="Mão segurando um coração, símbolo do ConectaONG">ConectaONG</a>
      <nav class="menu" aria-label="Menu principal">
        <a href="admin-painel.html">Início</a>
        <a href="admin-doacoes.html" class="ativo">Doações</a>
        <a href="admin-configuracoes.html">Minha Conta</a>
        <a href="index.html" id="sair">Sair</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <h1 class="titulo-pagina">Painel administrativo</h1>
      <div class="admin">
        <nav class="menu-lateral" aria-label="Menu do administrador">
          <a href="admin-painel.html">Visão geral</a>
          <a href="admin-ongs.html">Gerenciar ONGs</a>
          <a href="admin-doacoes.html" class="ativo">Gerenciar doações</a>
          <a href="admin-usuarios.html">Usuários</a>
          <a href="admin-relatorios.html">Relatórios</a>
          <a href="admin-configuracoes.html">Configurações</a>
        </nav>
        <div class="admin-conteudo">
          <h2>Gerenciar doações</h2>
          <section class="numeros " aria-label="Números">
            <div class="numero"><span>Doações pendentes</span><strong>45</strong></div>
            <div class="numero"><span>Concluídas no mês</span><strong>88</strong></div>
            <div class="numero"><span>Total no ano</span><strong>1.240</strong></div>
          </section>

          <form class="painel-cinza filtros" id="form-filtros-admin-doacoes" onsubmit="event.preventDefault();">
            <div class="campo">
              <label for="filtro-data">Data</label>
              <input type="date" id="filtro-data">
            </div>
            <div class="campo">
              <label for="filtro-nome">ONG ou doador</label>
              <input type="text" id="filtro-nome" placeholder="Digite um nome">
            </div>
            <div class="campo">
              <label for="filtro-status">Status</label>
              <select id="filtro-status">
                <option value="Todos">Todos</option>
                <option value="Pendente">Pendente</option>
                <option value="Recebida">Concluída</option>
              </select>
            </div>
            <button type="button" class="botao botao-pequeno" id="botao-aplicar-filtros-admin">Aplicar filtros</button>
          </form>
          <div class="lista" id="lista-doacoes-admin"></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="rodape">
    <p>&copy; 2026 ConectaONG. Todos os direitos reservados.</p>
  </footer>
  <script src="js/dados.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
